version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: careconnect-db
    environment:
      POSTGRES_DB: ${DB_NAME:-careconnect_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-careconnect_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./CareConnect-Backend
      dockerfile: Dockerfile
    container_name: careconnect-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-careconnect_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-9a4f2c8d7e6b5a4f3c2b1a0f9e8d7c6b5a4f3c2b1a0f9e8d7c6b5a4f3c2b1a0f}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./CareConnect-Frontend
      dockerfile: Dockerfile
    container_name: careconnect-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
